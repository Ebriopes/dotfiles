name: Sync Environment Cross Configurations

on:
  push:
    branches:
      - main
      - linux
      - mac-environment
      - windows
      - android-termux
    paths:
      - '.zshrc'
      - '.config/nvim/**'
      - '.github/workflows/**'
      - 'README.md'

# Definimos aquí las ramas que queremos mantener en el grupo de sincronización
env:
  SYNC_GROUP_UNIX: "main linux mac-environment android-termux"
  SYNC_GROUP_DOS: "main windows"
  SYNC_GROUP_BOTH: "main linux mac-environment android-termux windows"

jobs:
  sync-workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    uses: ./.github/workflows/sync-files.yaml
    with:
      commit-message: "👷: sync Workflows folder"
      files-path: ".github/workflows"
      target-branches: ${{ vars.SYNC_GROUP_ALL }}

  sync-zsh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync ZSHRC to other branches
        run: |
          SOURCE_BRANCH="${{ github.ref_name }}"
          echo "Rama origen: $SOURCE_BRANCH"

          # Usamos la variable de entorno directamente con la sintaxis de Bash $SYNC_GROUP
          for branch in $SYNC_GROUP_UNIX; do
            
            if [ "$branch" == "$SOURCE_BRANCH" ]; then
              echo "Saltando $branch (es la rama origen)."
              continue
            fi

            echo "--- Sincronizando ZSH con: $branch ---"
            
            if git checkout "$branch"; then
                git checkout "$SOURCE_BRANCH" -- .zshrc
                
                if ! git diff --cached --exit-code; then
                  git commit -m "🔧 Chore: sync .zshrc from '$SOURCE_BRANCH'"
                  git push origin "$branch"
                else
                  echo "No hay cambios detectados en $branch."
                fi
            else
                echo "Error: La rama $branch no existe o no se pudo acceder."
            fi
          done

  sync-neovim:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync Folder Process
        run: |
          FOLDER=".config/nvim"
          SOURCE_BRANCH="${{ github.ref_name }}"

          echo "Sincronizando carpeta: $FOLDER"
          echo "Desde rama origen: $SOURCE_BRANCH"

          for branch in $SYNC_GROUP_UNIX; do
            if [ "$branch" == "$SOURCE_BRANCH" ]; then
              continue
            fi

            echo "--- Procesando rama: $branch ---"

            if git checkout "$branch"; then
              # PASO CLAVE: Borramos el contenido actual en la rama destino para que 
              # si borraste un archivo en la origen, también se borre en la destino.
              rm -rf "$FOLDER"
              
              # Traemos la versión fresca de la carpeta desde la rama origen
              git checkout "$SOURCE_BRANCH" -- "$FOLDER"
              
              if ! git diff --cached --exit-code; then
                git commit -m ":bricks: Chore: sync Neovim configuration ($FOLDER from $SOURCE_BRANCH)"
                git push origin "$branch"
              else
                echo "No se detectaron cambios en $FOLDER para $branch."
              fi
            else
              echo "Error: No se pudo acceder a la rama $branch."
            fi
          done

  sync-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync README to other branches
        run: |
          # Usamos la variable de contexto de GitHub para saber qué rama disparó el push
          SOURCE_BRANCH="${{ github.ref_name }}"
          echo "Sincronizando desde la rama origen: $SOURCE_BRANCH"

          # Obtenemos las ramas remotas, excluyendo la rama que disparó la acción
          BRANCHES=$(git branch -r | grep -v "\->" | grep -v "origin/$SOURCE_BRANCH" | sed 's/origin\///' | xargs)

          for branch in $BRANCHES; do
            echo "--- Procesando rama: $branch ---"
            
            # Cambiamos a la rama destino
            git checkout $branch
            
            # Traemos el README de la rama que disparó el workflow
            git checkout $SOURCE_BRANCH -- README.md
            
            # Solo hacemos commit y push si hay cambios reales
            if ! git diff --cached --exit-code; then
              git commit -m ":memo: docs: sync README.md from $SOURCE_BRANCH 🤖"
              git push origin $branch
            else
              echo "Sin cambios para $branch. Saltando..."
            fi
          done

