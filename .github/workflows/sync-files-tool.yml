name: Super Sync Tool (Files & Branches)

on:
  # Configuración del formulario manual
  workflow_dispatch:
    inputs:
      file_path:
        description: 'Ruta del archivo a sincronizar'
        required: true
        default: '.github/workflows/sync-files'
      target_branches:
        description: 'Lista de ramas destino (separadas por espacio)'
        required: true
        default: 'main linux windows mac-environment'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync Process
        run: |
          # Leemos los inputs del formulario o usamos valores por defecto si es push automático
          # Si es push automático, el contexto github.event.inputs estará vacío
          
          FILE="${{ github.event.inputs.file_path || 'README.md' }}"
          BRANCHES="${{ github.event.inputs.target_branches || 'main linux windows mac-environment' }}"
          SOURCE_BRANCH="${{ github.ref_name }}"

          echo "Archivo a sincronizar: $FILE"
          echo "Desde la rama: $SOURCE_BRANCH"

          for branch in $BRANCHES; do
            if [ "$branch" == "$SOURCE_BRANCH" ]; then
              continue
            fi

            echo ">>> Actualizando $FILE en rama: $branch"
            
            if git checkout "$branch"; then
                # Traemos el archivo específico
                git checkout "$SOURCE_BRANCH" -- "$FILE"
                
                if ! git diff --cached --exit-code; then
                  git commit -m "docs: sync $FILE from $SOURCE_BRANCH"
                  git push origin "$branch"
                else
                  echo "Sin cambios para $branch."
                fi
            else
                echo "Error: La rama $branch no existe."
            fi
          done
